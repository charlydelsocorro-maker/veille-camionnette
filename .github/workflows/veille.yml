name: Veille utilitaires

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # pour enregistrer seen.json (annonces déjà vues)

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chercher les bonnes affaires
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Enregistrer les annonces vues
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Mise à jour des annonces vues" && git push)
